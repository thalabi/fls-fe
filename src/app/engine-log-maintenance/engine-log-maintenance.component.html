<p-table [value]="engineLogVArray" (onEditComplete)="onCommentEditComplete($event)" [paginator]="true"
    [rowsPerPageOptions]="[10,20,30]" [rows]="ROWS_PER_PAGE" [totalRecords]="page.totalElements"
    [loading]="loadingStatus" [loading]="loadingStatus" [lazy]="true" (onLazyLoad)="onLazyLoad($event)" dataKey="id"
    size="small">

    <ng-template #caption>
        <div style="text-align: center;">
            <span style="font-weight: bold; font-size: larger;">Engine log</span>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th>Date</th>
            <th>Airtime</th>
            <th>TSMOH</th>
            <th>Comment <small>(editable)</small></th>
        </tr>
    </ng-template>
    <ng-template #body let-engineLog let-editing="editing" let-rowIndex="rowIndex">
        <tr>
            <td [pTooltip]="dateTooltip">{{engineLog.date | date: 'yy/M/d'}}</td>
            <td>{{engineLog.airtime}}</td>
            <td>{{engineLog.tsmoh}}</td>
            <td [pEditableColumn]="engineLog.comment" pEditableColumnField="comment">
                <p-cellEditor>
                    <ng-template #input>
                        <input pInputText type="text" [(ngModel)]="engineLog.comment" />
                    </ng-template>
                    <ng-template #output>
                        <span class="pi pi-pencil">{{ engineLog.comment }}</span>
                    </ng-template>
                </p-cellEditor>
            </td>
        </tr>
        <ng-template #dateTooltip>
            <span>{{engineLog.date | date: 'h:mm a'}}</span>
        </ng-template>
    </ng-template>
</p-table>
